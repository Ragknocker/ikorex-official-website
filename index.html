<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iKOREX | Enterprise Intelligent Process Automation</title>
  <meta name="description"
    content="Automate repetitive business processes with AI to save time, reduce costs, and help your team focus on what matters most.">
  <link rel="canonical" href="https://ikorex.com.au/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@ikorex_official">
  <meta name="keywords"
    content="AI process automation, intelligent automation, financial workflows, enterprise AI, Melbourne automation">

  <!-- Favicon & Search Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ikorex.com.au/">
  <meta property="og:title" content="iKOREX | Enterprise Intelligent Process Automation">
  <meta property="og:description"
    content="Automate repetitive business processes with AI to save time, reduce costs, and help your team focus on what matters most.">
  <meta property="og:image" content="https://ikorex.com.au/logo.png">

  <!-- Google Organization & Search Logo Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "iKOREX",
    "url": "https://ikorex.com.au",
    "logo": "https://ikorex.com.au/logo.png",
    "description": "Enterprise-grade intelligent process automation for modern businesses.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Melbourne",
      "addressRegion": "VIC",
      "addressCountry": "AU"
    }
  }
  </script>

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&family=Inter+Tight:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
