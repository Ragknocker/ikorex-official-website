name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify AWS Deployment Configuration
        id: check_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CF_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ] && [ -n "$AWS_REGION" ] && [ -n "$S3_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AWS deployment credentials detected. Proceeding to S3 sync."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment Skipped::AWS deployment secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET) are not configured in this repository. Build verification succeeded!"
          fi

          if [ -n "$CF_DIST" ]; then
            echo "has_cloudfront=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cloudfront=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Files to S3
        if: steps.check_aws.outputs.configured == 'true'
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront Cache
        if: steps.check_aws.outputs.configured == 'true' && steps.check_aws.outputs.has_cloudfront == 'true'
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: "/*"
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        continue-on-error: true

      - name: Fallback Invalidate CloudFront Cache via AWS CLI
        if: steps.check_aws.outputs.configured == 'true' && steps.check_aws.outputs.has_cloudfront == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        continue-on-error: true
